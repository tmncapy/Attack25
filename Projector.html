<script>
    (function checkProjectorRoom() {
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomid');
        if (!roomId) {
            document.addEventListener('DOMContentLoaded', function () {
                const overlay = document.createElement('div');
                overlay.id = 'noRoomOverlay';
                overlay.style.cssText = 'position:fixed; inset:0; background:#0b0f17; z-index:999999; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:#ff6b6b; font-size:28px; font-weight:bold; padding:20px; font-family:sans-serif;';
                overlay.innerHTML = '<div style="font-size:60px; margin-bottom:16px;">⚠️</div><div>Vui lòng nhập tham số ?roomid=Mã phòng trên URL</div>';
                document.body.appendChild(overlay);
            });
        }
    })();

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || (e.ctrlKey && e.keyCode === 85)) {
            e.preventDefault();
            return false;
        }
    });

<script>

/* =====================================================
   UNIVERSAL RESOLUTION AUTO-SCALER (4K, 1080p, TV, Mobile)
===================================================== */
const gameElement = document.getElementById("game");
const BASE_WIDTH = 1280;
const BASE_HEIGHT = 720;

function autoScaleProjector() {
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;

    const scaleX = windowWidth / BASE_WIDTH;
    const scaleY = windowHeight / BASE_HEIGHT;
    const scale = Math.min(scaleX, scaleY);

    gameElement.style.transform = `scale(${scale})`;
}

window.addEventListener('resize', autoScaleProjector);
window.addEventListener('orientationchange', autoScaleProjector);
autoScaleProjector();

// Auto-Hide HUD for cinematic projector presentation
const hud = document.getElementById('projectorHud');
let hudTimer = null;

function resetHudTimer() {
    if (!hud) return;
    hud.classList.remove('idle');
    clearTimeout(hudTimer);
    hudTimer = setTimeout(() => {
        hud.classList.add('idle');
    }, 3000);
}

window.addEventListener('mousemove', resetHudTimer);
window.addEventListener('touchstart', resetHudTimer);
resetHudTimer();


/* =====================================================
   SCREEN WAKE LOCK (Keep TV / Projector Display Awake)
===================================================== */
let wakeLock = null;
async function requestScreenWakeLock() {
    try {
        if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
        }
    } catch (err) {}
}
requestScreenWakeLock();
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
        requestScreenWakeLock();
    }
});


/* =====================================================
   FULLSCREEN & SHORTCUTS
===================================================== */
function toggleFullScreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
}

document.getElementById('btnFullscreen')?.addEventListener('click', toggleFullScreen);
document.body.addEventListener('dblclick', toggleFullScreen);

window.addEventListener('keydown', (e) => {
    if (e.key === 'f' || e.key === 'F') {
        toggleFullScreen();
    } else if (e.key === 's' || e.key === 'S') {
        promptServerConfig();
    } else if (e.key === 'm' || e.key === 'M') {
        toggleAudio();
    }
});


/* =====================================================
   AUDIO ENGINE (WAV AUDIO FILES + SYNTHESIZER FALLBACK)
===================================================== */
let audioCtx = null;
let isMuted = false;

const colorWavMap = {
    'red': 'red.wav',
    'green': 'green.wav',
    'white': 'white.wav',
    'blue': 'blue.wav',
    'buzzer_red': 'red.wav',
    'buzzer_green': 'green.wav',
    'buzzer_white': 'white.wav',
    'buzzer_blue': 'blue.wav',
    'buzz_red': 'red.wav',
    'buzz_green': 'green.wav',
    'buzz_white': 'white.wav',
    'buzz_blue': 'blue.wav'
};

function getAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    const banner = document.getElementById('audioBanner');
    if (banner) banner.style.display = 'none';
    return audioCtx;
}

window.addEventListener('click', () => {
    getAudioContext();
}, { once: true });

document.getElementById('audioBanner')?.addEventListener('click', () => {
    getAudioContext();
});

function toggleAudio() {
    isMuted = !isMuted;
    const btn = document.getElementById('btnAudioToggle');
    if (btn) btn.textContent = isMuted ? '🔇 Đã tắt âm' : '🔊 Âm thanh';
    if (!isMuted) getAudioContext();
}

document.getElementById('btnAudioToggle')?.addEventListener('click', toggleAudio);

function stopAllSounds() {
    if (window.activeAudios && Array.isArray(window.activeAudios)) {
        window.activeAudios.forEach(audio => {
            try {
                audio.pause();
                audio.currentTime = 0;
            } catch (e) {}
        });
        window.activeAudios = [];
    }
}

function playSound(type) {
    if (isMuted || (window.self !== window.top) || window.location.search.includes('preview=1')) return;

    if (type === 'stop') {
        stopAllSounds();
        return;
    }

    let wavFile = colorWavMap[type];
    if (!wavFile && (type.endsWith('.mp3') || type.endsWith('.wav'))) {
        wavFile = type;
    }

    if (wavFile) {
        try {
            const audio = new Audio(wavFile);
            audio.volume = 1.0;
            window.activeAudios = window.activeAudios || [];
            window.activeAudios.push(audio);
            audio.addEventListener('ended', () => {
                const idx = window.activeAudios.indexOf(audio);
                if (idx > -1) window.activeAudios.splice(idx, 1);
            });
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    playSynthTone(type);
                });
            }
            return;
        } catch (e) {
            playSynthTone(type);
            return;
        }
    }

    // 2. Play standard game sound effect via synthesizer
    playSynthTone(type);
}

function playSynthTone(type) {
    try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        if (type === 'buzzer' || type === 'buzzer_red' || type === 'red') {
            // RED: Deep, powerful punch tone
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(660, now);
            osc.frequency.exponentialRampToValueAtTime(330, now + 0.35);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        } else if (type === 'buzzer_green' || type === 'green') {
            // GREEN: Bright energetic ring
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(587.33, now);
            osc.frequency.setValueAtTime(880, now + 0.1);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        } else if (type === 'buzzer_white' || type === 'white') {
            // WHITE: High crystal chime
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1046.50, now);
            osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.35);
            gain.gain.setValueAtTime(0.45, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        } else if (type === 'buzzer_blue' || type === 'blue') {
            // BLUE: Resonant power chime
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(1046.50, now + 0.1);
            gain.gain.setValueAtTime(0.38, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        } else if (type === 'correct') {
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.2, now + i * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + i * 0.08);
                osc.stop(now + i * 0.08 + 0.35);
            });
        } else if (type === 'wrong') {
            [180, 140].forEach(freq => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.45);
            });
        } else if (type === 'arm') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, now);
            osc.frequency.setValueAtTime(880, now + 0.08);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
        }
    } catch (e) {}
}


/* =====================================================
   TẠO BẢNG 5 x 5
===================================================== */
const panelBoard = document.getElementById("panelBoard");
const panelElements = {};

for (let row = 0; row < 5; row++) {
    for (let col = 0; col < 5; col++) {
        const number = row * 5 + col + 1;

        const panel = document.createElement("div");
        panel.className = "default-panel";
        panel.id = "panel-" + number;
        panel.dataset.number = number;
        panel.dataset.row = row + 1;
        panel.dataset.col = col + 1;

        const image = document.createElement("img");
        image.src = "DefaultPanel.png";
        image.alt = "";
        image.id = "panel-img-" + number;

        const numberText = document.createElement("div");
        numberText.className = "panel-number";
        numberText.textContent = number;

        panel.appendChild(image);
        panel.appendChild(numberText);

        panelBoard.appendChild(panel);
        panelElements[number] = { container: panel, image: image, text: numberText };
    }
}


/* =====================================================
   DỮ LIỆU ĐIỂM & TRẠNG THÁI
===================================================== */
const scores = { red: 0, green: 0, white: 0, blue: 0 };

function setScore(player, score) {
    if (scores.hasOwnProperty(player)) {
        scores[player] = score;
        const elementId = "score" + player.charAt(0).toUpperCase() + player.slice(1);
        const el = document.getElementById(elementId);
        if (el) el.textContent = score;
    }
}

function setPlayerName(playerNumber, name) {
    const element = document.getElementById("player" + playerNumber);
    if (element) {
        element.textContent = name;
    }
}


/* =====================================================
   PERSISTENT VIDEO PLAYBACK & KEEP-ALIVE SYSTEM
===================================================== */
let currentVideoState = { url: '', embedUrl: '', visible: false, playing: false };
let keepAliveAudioCtx = null;
let keepAliveTimer = null;

function keepAudioActive() {
    try {
        if (!keepAliveAudioCtx) {
            keepAliveAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (keepAliveAudioCtx.state === 'suspended') {
            keepAliveAudioCtx.resume();
        }
        const osc = keepAliveAudioCtx.createOscillator();
        const gain = keepAliveAudioCtx.createGain();
        gain.gain.value = 0.00001;
        osc.connect(gain);
        gain.connect(keepAliveAudioCtx.destination);
        osc.start();
    } catch (e) {}
}

function startKeepAliveLoop() {
    keepAudioActive();
    if (keepAliveTimer) clearInterval(keepAliveTimer);
    keepAliveTimer = setInterval(() => {
        if (currentVideoState && currentVideoState.visible && currentVideoState.playing) {
            keepAudioActive();
            sendIframeCommand('play');
        }
    }, 1000);
}

function stopKeepAliveLoop() {
    if (keepAliveTimer) {
        clearInterval(keepAliveTimer);
        keepAliveTimer = null;
    }
}

function sendIframeCommand(cmd) {
    const iframe = document.getElementById("projectorVideoIframe");
    if (!iframe || !iframe.contentWindow) return;
    try {
        iframe.contentWindow.postMessage(JSON.stringify({ method: cmd }), '*');
        iframe.contentWindow.postMessage(cmd, '*');
    } catch (e) {}
}

let lastPlayToken = null;

function updateProjectorVideo(videoState) {
    if (!videoState) return;
    const container = document.getElementById("projectorVideoContainer");
    const iframe = document.getElementById("projectorVideoIframe");
    if (!container || !iframe) return;

    currentVideoState = Object.assign({}, videoState);

    let targetSrc = videoState.embedUrl || '';
    if (targetSrc) {
        let params = [];
        if (videoState.playing) params.push('autoplay=1');
        params.push('loop=0');
        params.push('muted=0');
        targetSrc += (targetSrc.includes('?') ? '&' : '?') + params.join('&');
    }

    const isNewPlayToken = videoState.playToken && videoState.playToken !== lastPlayToken;
    if (isNewPlayToken) {
        lastPlayToken = videoState.playToken;
    }

    if (videoState.visible && targetSrc) {
        container.style.display = "block";
        const currentDataSrc = iframe.getAttribute("data-src");
        if (currentDataSrc !== targetSrc || isNewPlayToken) {
            iframe.src = targetSrc;
            iframe.setAttribute("data-src", targetSrc);
        }
    } else {
        container.style.display = "none";
        if (iframe.src && iframe.src !== 'about:blank') {
            iframe.src = "about:blank";
            iframe.removeAttribute("data-src");
        }
    }

    if (videoState.visible && videoState.playing) {
        sendIframeCommand('play');
        startKeepAliveLoop();
    } else {
        sendIframeCommand('pause');
        stopKeepAliveLoop();
    }
}

document.addEventListener('visibilitychange', () => {
    if (!document.hidden && currentVideoState.visible && currentVideoState.playing) {
        sendIframeCommand('play');
        keepAudioActive();
    }
});

window.addEventListener('focus', () => {
    if (currentVideoState.visible && currentVideoState.playing) {
        sendIframeCommand('play');
        keepAudioActive();
    }
});

/* =====================================================
   ÁP DỤNG GAME STATE TỪ CONTROLLER
===================================================== */
function applyGameState(state) {
    if (!state) return;

    // 1. Cập nhật các ô trên bảng
    if (state.panels && Array.isArray(state.panels)) {
        state.panels.forEach(panelData => {
            const elObj = panelElements[panelData.number];
            if (!elObj) return;

            const isSelected = state.selectedPanel === panelData.number;
            const isUsed = !!panelData.used;

            elObj.container.classList.toggle("active", isSelected);
            elObj.container.classList.toggle("used", isUsed);

            if (panelData.color) {
                const colorMap = {
                    red: "RedPanel.png",
                    green: "GreenPanel.png",
                    white: "WhitePanel.png",
                    blue: "BluePanel.png"
                };
                elObj.image.src = colorMap[panelData.color] || "DefaultPanel.png";

                if (state.hiddenColors && state.hiddenColors[panelData.color]) {
                    elObj.container.classList.add("color-hidden");
                } else {
                    elObj.container.classList.remove("color-hidden");
                }
            } else {
                elObj.image.src = "DefaultPanel.png";
                elObj.container.classList.remove("color-hidden");
            }
        });

        // Điểm của người chơi luôn đúng bằng số ô người đó chiếm được trên bảng
        const redScore = state.panels.filter(p => p.color === 'red').length;
        const greenScore = state.panels.filter(p => p.color === 'green').length;
        const whiteScore = state.panels.filter(p => p.color === 'white').length;
        const blueScore = state.panels.filter(p => p.color === 'blue').length;

        setScore("red", redScore);
        setScore("green", greenScore);
        setScore("white", whiteScore);
        setScore("blue", blueScore);
    } else if (state.players) {
        if (state.players.red) setScore("red", state.players.red.score);
        if (state.players.green) setScore("green", state.players.green.score);
        if (state.players.white) setScore("white", state.players.white.score);
        if (state.players.blue) setScore("blue", state.players.blue.score);
    }

    // 2. Cập nhật tên người chơi
    if (state.players) {
        if (state.players.red) setPlayerName(1, state.players.red.name);
        if (state.players.green) setPlayerName(2, state.players.green.name);
        if (state.players.white) setPlayerName(3, state.players.white.name);
        if (state.players.blue) setPlayerName(4, state.players.blue.name);
    }

    // 3. Cập nhật Buzzer Spotlight, Scoreboard Highlight & Banner
    if (state.buzzer) {
        updateBuzzerDisplay(state.buzzer, state.players);
    }

    // 4. Cập nhật Streamable Video Container & Playback
    if (state.video) {
        updateProjectorVideo(state.video);
    }
}


/* =====================================================
   CẬP NHẬT GIAO DIỆN BUZZER VÀ HIGHLIGHT SCOREBOARD TRÊN PROJECTOR
===================================================== */
function updateBuzzerDisplay(buzzer, players) {
    const banner = document.getElementById("screenBuzzerAlert");
    const icon = document.getElementById("alertIcon");
    const text = document.getElementById("alertText");

    const playerIndexMap = { red: 1, green: 2, white: 3, blue: 4 };

    // Reset all spotlights, scoreboard highlights, and name glows
    ['red', 'green', 'white', 'blue'].forEach((color, idx) => {
        const cap = color.charAt(0).toUpperCase() + color.slice(1);
        const spot = document.getElementById("spotlight" + cap);
        if (spot) spot.classList.remove("active");

        const scoreBox = document.getElementById("scoreBox" + cap);
        if (scoreBox) {
            scoreBox.className = "score-item score-" + color;
        }

        const nameEl = document.getElementById("player" + (idx + 1));
        if (nameEl) {
            nameEl.classList.remove("buzzed-highlight");
        }
    });

    if (buzzer.status === 'armed') {
        banner.className = "screen-buzzer-alert show state-armed";
        icon.textContent = "🔔";
        text.textContent = "SẴN SÀNG BẤM CHUÔNG GIÀNH QUYỀN!";
    } else if (buzzer.status === 'buzzed' && buzzer.winner) {
        const winnerColor = buzzer.winner;
        const winnerName = players && players[winnerColor] ? players[winnerColor].name : winnerColor.toUpperCase();
        const cap = winnerColor.charAt(0).toUpperCase() + winnerColor.slice(1);

        // 1. Bật Spotlight ánh sáng màu tương ứng
        const spot = document.getElementById("spotlight" + cap);
        if (spot) spot.classList.add("active");

        // 2. HIGHLIGHT SCOREBOARD người bấm tương ứng
        const scoreBox = document.getElementById("scoreBox" + cap);
        if (scoreBox) {
            scoreBox.classList.add("buzzed-highlight", "buzzed-" + winnerColor);
        }

        // 3. HIGHLIGHT TÊN người chơi bấm chuông
        const nameEl = document.getElementById("player" + playerIndexMap[winnerColor]);
        if (nameEl) {
            nameEl.classList.add("buzzed-highlight");
        }

        // 4. Banner thông báo với màu đội bấm
        banner.className = `screen-buzzer-alert show state-buzzed state-buzzed-${winnerColor}`;
        icon.textContent = "⚡";
        text.textContent = `${winnerName.toUpperCase()} GIÀNH QUYỀN TRẢ LỜI!`;
    } else {
        banner.className = "screen-buzzer-alert";
    }
}


function showPrompt(title, defaultValue, onConfirm) {
    let overlay = document.getElementById('customPromptModal');
    if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'customPromptModal';
        overlay.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:10000;font-family:inherit;';
        overlay.innerHTML = `
            <div style="background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px;max-width:480px;width:90%;color:#fff;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">
                <div id="customPromptTitle" style="font-size:15px;font-weight:bold;margin-bottom:12px;line-height:1.4;color:#f8fafc;"></div>
                <input type="text" id="customPromptInput" style="width:100%;padding:10px 12px;border-radius:6px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:14px;margin-bottom:20px;box-sizing:border-box;outline:none;" />
                <div style="display:flex;justify-content:flex-end;gap:10px;">
                    <button id="customPromptCancel" style="padding:8px 16px;border-radius:6px;border:1px solid #475569;background:#334155;color:#fff;cursor:pointer;font-weight:bold;">Hủy</button>
                    <button id="customPromptOk" style="padding:8px 16px;border-radius:6px;border:none;background:#2563eb;color:#fff;cursor:pointer;font-weight:bold;">Xác nhận</button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
    }
    const titleEl = overlay.querySelector('#customPromptTitle');
    const inputEl = overlay.querySelector('#customPromptInput');
    const okBtn = overlay.querySelector('#customPromptOk');
    const cancelBtn = overlay.querySelector('#customPromptCancel');

    titleEl.textContent = title;
    inputEl.value = defaultValue || '';
    overlay.style.display = 'flex';
    setTimeout(() => inputEl.focus(), 50);

    const close = () => {
        overlay.style.display = 'none';
        okBtn.onclick = null;
        cancelBtn.onclick = null;
        inputEl.onkeydown = null;
    };

    okBtn.onclick = () => {
        const val = inputEl.value;
        close();
        if (onConfirm) onConfirm(val);
    };

    cancelBtn.onclick = () => {
        close();
    };

    inputEl.onkeydown = (e) => {
        if (e.key === 'Enter') {
            okBtn.click();
        } else if (e.key === 'Escape') {
            cancelBtn.click();
        }
    };
}

/* =====================================================
   KẾT NỐI ĐỒNG BỘ THỜI GIAN THỰC (UNIVERSAL & CLOUD)
===================================================== */
function promptServerConfig() {
    const current = localStorage.getItem('attack25_ws_server_host') || window.location.host || 'localhost:3000';
    showPrompt("Nhập địa chỉ máy chủ WebSocket từ xa (Ví dụ: 192.168.1.10:3000 hoặc your-app.run.app):", current, (server) => {
        if (server !== null && server !== undefined) {
            Attack25Sync.setServerHost(server.trim());
        }
    });
}

document.getElementById('hudConnStatus')?.addEventListener('click', promptServerConfig);

if (window.Attack25Sync) {
    Attack25Sync.onStateChange((state) => {
        applyGameState(state);
    });
    Attack25Sync.onSound((sound) => {
        playSound(sound);
    });
    Attack25Sync.onConnectionChange((conn) => {
        const dot = document.getElementById('hudDot');
        const text = document.getElementById('hudText');
        const isOnline = typeof conn === 'object' ? conn.connected : !!conn;
        const mode = typeof conn === 'object' ? conn.mode : 'websocket';

        if (dot) {
            dot.style.background = isOnline ? '#22c55e' : '#ef4444';
            dot.style.boxShadow = isOnline ? '0 0 8px #22c55e' : '0 0 8px #ef4444';
        }
        if (text) {
            if (isOnline) {
                text.textContent = mode === 'websocket' ? 'REAL-TIME ONLINE' : 'LOCAL SYNC';
            } else {
                text.textContent = 'CONNECTING...';
            }
        }
    });
}
