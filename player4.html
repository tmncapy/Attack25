<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Attack 25 - Player 4 (Xanh Dương)</title>
<script>
    window.DisableDevtool = { isOpened: false, onDevToolOpened: function(){}, close: function(){} };
    window.disableDevtool = function(){};
</script>
<script src="jquery.js"></script>
<script src="socket.io.js"></script>
<script src="howler.js"></script>
<script src="sync-client.js?v=20260920b"></script>
<script>
    (function () {
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('roomid') || urlParams.get('roomId') || urlParams.get('room');
        let auth = urlParams.get('auth');

        if (!roomId) {
            try { roomId = localStorage.getItem('attack25_active_roomid') || '123456'; } catch (e) { roomId = '123456'; }
        }
        if (!auth) {
            auth = '4444';
        }

        if (window.Attack25Sync && typeof Attack25Sync.setRoomId === 'function') {
            Attack25Sync.setRoomId(roomId, auth);
        }

        fetch('/api/verify-room?roomid=' + encodeURIComponent(roomId) + '&auth=' + encodeURIComponent(auth) + '&role=player4')
            .then(res => res.ok ? res.json() : null)
            .then(data => {
                if (data && data.success) {
                    if (window.Attack25Sync && typeof Attack25Sync.setRoomId === 'function') {
                        Attack25Sync.setRoomId(roomId, auth);
                    }
                }
            })
            .catch(() => {});
    })();
</script>

<style>
@font-face {
    font-family: "UTM Impact";
    src: local("UTM Impact"), local("Impact"), url("UTM Impact.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
}

:root {
    --team-color: #3b82f6;
    --team-glow: rgba(59, 130, 246, 0.6);
    --team-dark: #172554;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    font-weight: bold !important;
}

/* Tắt bold đối với tất cả thành phần sử dụng font UTM Impact */
.team-title,
.score-val,
.buzzer-main-text,
[style*="UTM Impact"],
[style*="utm impact"],
[style*="Impact"],
.utm-impact {
    font-weight: normal !important;
    font-synthesis: none !important;
}

button:hover,
.button:hover,
.btn:hover,
input[type="button"]:hover,
input[type="submit"]:hover,
[role="button"]:hover,
.action-btn:hover,
.panel-btn:hover,
.reset-btn:hover,
.buzzer-btn:hover,
.btn-primary:hover,
.btn-secondary:hover,
.btn-success:hover,
.btn-danger:hover,
.btn-warning:hover,
.btn-info:hover,
.btn-dark:hover {
    background: #C2410C !important;
    background-color: #C2410C !important;
    color: white !important;
    font-weight: bold !important;
}

html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #080a0f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

.full-buzzer-screen {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: clamp(16px, 4vw, 32px);
    cursor: pointer;
    transition: all 0.15s ease;
    position: relative;
    overflow: hidden;
}

.top-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
    pointer-events: none;
}

.team-badge {
    background: rgba(0, 0, 0, 0.45);
    border: 2px solid var(--team-color);
    padding: 8px 16px;
    border-radius: 30px;
    display: flex;
    align-items: center;
    gap: 10px;
    backdrop-filter: blur(8px);
}

.team-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--team-color);
    box-shadow: 0 0 10px var(--team-color);
}

.team-title {
    font-family: "UTM Impact", Impact, sans-serif;
    font-size: clamp(16px, 2.5vw, 22px);
    color: #fff;
    letter-spacing: 0.5px;
}

.score-badge {
    background: rgba(0, 0, 0, 0.45);
    border: 2px solid #f59f00;
    padding: 6px 16px;
    border-radius: 30px;
    display: flex;
    align-items: center;
    gap: 8px;
    backdrop-filter: blur(8px);
}

.score-label {
    font-size: 11px;
    color: #cbd5e1;
    font-weight: 700;
    text-transform: uppercase;
}

.score-val {
    font-family: "UTM Impact", Impact, sans-serif;
    font-size: clamp(18px, 3vw, 26px);
    color: #ffd43b;
}

.center-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 16px;
    z-index: 10;
    pointer-events: none;
    max-width: 90%;
}

.buzzer-icon {
    font-size: clamp(64px, 15vw, 130px);
    line-height: 1;
    transition: transform 0.2s ease;
    filter: drop-shadow(0 0 20px rgba(0,0,0,0.5));
}

.buzzer-main-text {
    font-family: "UTM Impact", Impact, sans-serif;
    font-size: clamp(28px, 6.5vw, 64px);
    letter-spacing: 1px;
    line-height: 1.1;
    color: #ffffff;
    text-shadow: 0 4px 16px rgba(0,0,0,0.7);
}

.buzzer-sub-text {
    font-size: clamp(14px, 2.2vw, 22px);
    font-weight: 700;
    color: rgba(255, 255, 255, 0.85);
    background: rgba(0, 0, 0, 0.35);
    padding: 8px 20px;
    border-radius: 20px;
}

.bottom-bar {
    z-index: 10;
    pointer-events: none;
    font-size: clamp(11px, 1.8vw, 14px);
    color: rgba(255, 255, 255, 0.6);
    text-align: center;
}

/* STATES */
.full-buzzer-screen.locked {
    background: radial-gradient(circle at center, #171b26 0%, #090c13 100%);
    border: 6px solid #232d3f;
}
.full-buzzer-screen.locked .buzzer-main-text { color: #64748b; }

.full-buzzer-screen.armed {
    background: radial-gradient(circle at center, var(--team-color) 0%, var(--team-dark) 100%);
    border: 8px solid #ffffff;
    box-shadow: inset 0 0 80px rgba(255, 255, 255, 0.4), 0 0 60px var(--team-glow);
    animation: armedPulse 0.8s infinite alternate ease-in-out;
}
@keyframes armedPulse {
    0% { filter: brightness(1); }
    100% { filter: brightness(1.25); box-shadow: inset 0 0 100px rgba(255,255,255,0.6), 0 0 100px var(--team-glow); }
}

.full-buzzer-screen.armed:active {
    transform: scale(0.98);
    filter: brightness(1.5) !important;
}

.full-buzzer-screen.winner-me {
    background: radial-gradient(circle at center, #f59f00 0%, #78350f 100%);
    border: 8px solid #ffd43b;
    box-shadow: inset 0 0 100px #ffd43b, 0 0 80px #f59f00;
    animation: winnerPulse 0.6s infinite alternate;
}
@keyframes winnerPulse {
    0% { transform: scale(1); filter: brightness(1.1); }
    100% { transform: scale(1.02); filter: brightness(1.35); }
}

.full-buzzer-screen.winner-other {
    background: radial-gradient(circle at center, #1e2430 0%, #0d1117 100%);
    border: 6px solid #334155;
}
.full-buzzer-screen.winner-other .buzzer-main-text { color: #94a3b8; }

.full-buzzer-screen.penalized {
    background: radial-gradient(circle at center, #2e0d0d 0%, #0f0404 100%);
    border: 6px solid #ef4444;
}
.full-buzzer-screen.penalized .buzzer-main-text { color: #f87171; }
</style>
</head>

<body>

<div class="full-buzzer-screen locked" id="screen" onclick="triggerBuzz()" ontouchstart="triggerBuzzTouch(event)">

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="team-badge">
            <div class="team-dot"></div>
            <div class="team-title" id="playerNameDisplay">PLAYER 4 (XANH DƯƠNG)</div>
        </div>
        <div id="connStatusBadge" style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.2); cursor: pointer;" onclick="event.stopPropagation(); if (window.Attack25Sync) Attack25Sync.reconnect();">
            <span id="connStatusDot" style="color: #fcc419;">🟡</span> <span id="connStatusText">PHÒNG ...</span>
        </div>
        <div class="score-badge">
            <span class="score-label">ĐIỂM:</span>
            <span class="score-val" id="playerScoreDisplay">0</span>
        </div>
    </div>

    <!-- CENTER GIANT BUZZER -->
    <div class="center-content">
        <div class="buzzer-icon" id="buzzerIcon">🔒</div>
        <div class="buzzer-main-text" id="buzzerMainText">ĐÃ KHÓA CHUÔNG</div>
        <div class="buzzer-sub-text" id="buzzerSubText">Chờ lệnh mở từ MC...</div>
    </div>

    <!-- BOTTOM BAR -->
    <div class="bottom-bar">
        <span>CHẠM BẤT KỲ ĐÂU TRÊN MÀN HÌNH ĐỂ BẤM CHUÔNG</span>
    </div>

</div>

<script>
const MY_ROLE = 'blue';

let audioCtx = null;
function getAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}

function playBuzzChime() {
    // Chỉ phát âm thanh trên Projector, không phát cho người chơi
    return;
}

let gameState = {
    players: { blue: { name: "PLAYER 4", score: 0 } },
    buzzer: { status: 'locked', winner: null, buzzTime: null, pressOrder: [], lockedPlayers: [] }
};

let toastTimer = null;
function showPlayerToast(msg) {
    let t = document.getElementById('playerToast');
    if (!t) {
        t = document.createElement('div');
        t.id = 'playerToast';
        t.style.cssText = 'position:fixed; top:70px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.88); color:#ffd43b; padding:10px 18px; border-radius:8px; font-weight:700; font-size:13px; z-index:9999; border:1px solid #f59f00; box-shadow:0 8px 24px rgba(0,0,0,0.6); text-align:center; max-width:90%; pointer-events:none; transition:opacity 0.2s;';
        document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.style.opacity = '0'; }, 2600);
}

if (window.Attack25Sync) {
    Attack25Sync.onStateChange((state) => {
        applyState(state);
    });
    Attack25Sync.onSound((snd) => {
        if (snd === 'buzzer_blue' || snd === 'blue') {
            playBuzzChime();
        }
    });
    Attack25Sync.onConnectionChange((conn) => {
        const dot = document.getElementById('connStatusDot');
        const txt = document.getElementById('connStatusText');
        const badge = document.getElementById('connStatusBadge');
        const isOnline = typeof conn === 'object' ? conn.connected : !!conn;
        const mode = (typeof conn === 'object' && conn.mode) ? conn.mode : (isOnline ? 'websocket' : 'local');
        const room = (typeof conn === 'object' && conn.roomId) ? conn.roomId : (Attack25Sync.getRoomId() || '123456');

        if (dot && txt) {
            if (isOnline) {
                dot.style.color = '#2fb344';
                dot.textContent = '🟢';
                txt.textContent = `P.${room}`;
                if (badge) badge.style.borderColor = 'rgba(47, 179, 68, 0.5)';
            } else if (mode === 'polling') {
                dot.style.color = '#fcc419';
                dot.textContent = '🟡';
                txt.textContent = `HTTP P.${room}`;
                if (badge) badge.style.borderColor = 'rgba(252, 196, 25, 0.5)';
            } else {
                dot.style.color = '#e03131';
                dot.textContent = '🔴';
                txt.textContent = `MẤT KẾT NỐI (Chạm)`;
                if (badge) badge.style.borderColor = 'rgba(224, 49, 49, 0.6)';
            }
        }
    });
}

function triggerBuzzTouch(event) {
    event.preventDefault();
    triggerBuzz();
}

function triggerBuzz() {
    getAudioContext();

    if (gameState.buzzer.lockedPlayers && gameState.buzzer.lockedPlayers.includes(MY_ROLE)) {
        showPlayerToast('⚠️ BẠN ĐANG BỊ KHÓA CHUÔNG CÂU NÀY!');
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        return;
    }

    if (gameState.buzzer.status !== 'armed') {
        showPlayerToast('⚠️ CHUÔNG CHƯA MỞ! Chờ MC mở chuông (Bấm Space trên Controller)');
        if (navigator.vibrate) navigator.vibrate(80);
        if (window.Attack25Sync && typeof Attack25Sync.sendPlayerBuzzAttempt === 'function') {
            Attack25Sync.sendPlayerBuzzAttempt(MY_ROLE);
        }
        return;
    }

    if (navigator.vibrate) {
        navigator.vibrate(150);
    }
    playBuzzChime();

    const mainText = document.getElementById('buzzerMainText');
    const subText = document.getElementById('buzzerSubText');
    if (mainText) mainText.textContent = '⚡ ĐÃ BẤM CHUÔNG!';
    if (subText) subText.textContent = 'Đang gửi tín hiệu về Controller...';

    if (window.Attack25Sync) {
        Attack25Sync.sendPlayerBuzz(MY_ROLE);
    }
}

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === 'Enter' || e.key === '4' || e.key === 'r') {
        e.preventDefault();
        triggerBuzz();
    }
});

function applyState(state) {
    if (!state) return;
    gameState = state;

    const me = state.players ? state.players[MY_ROLE] : null;
    if (me) {
        document.getElementById('playerNameDisplay').textContent = `${me.name} (XANH DƯƠNG)`;
        const panelCount = (state.panels && Array.isArray(state.panels))
            ? state.panels.filter(p => p.color === MY_ROLE).length
            : (me.score || 0);
        document.getElementById('playerScoreDisplay').textContent = panelCount;
    }

    const b = state.buzzer || {};
    const screen = document.getElementById('screen');
    const icon = document.getElementById('buzzerIcon');
    const mainText = document.getElementById('buzzerMainText');
    const subText = document.getElementById('buzzerSubText');

    screen.className = 'full-buzzer-screen';

    const isLocked = b.lockedPlayers && b.lockedPlayers.includes(MY_ROLE);

    if (isLocked) {
        screen.classList.add('penalized');
        icon.textContent = '❌';
        mainText.textContent = 'BỊ KHÓA CHUÔNG';
        subText.textContent = 'Bạn đã trả lời sai câu này';
    } else if (b.status === 'armed') {
        screen.classList.add('armed');
        icon.textContent = '⚡';
        mainText.textContent = 'BẤM CHUÔNG NGAY!';
        subText.textContent = 'Chạm bất kỳ đâu trên màn hình!';
    } else if (b.status === 'buzzed') {
        if (b.winner === MY_ROLE) {
            screen.classList.add('winner-me');
            icon.textContent = '🏆';
            mainText.textContent = 'BẠN ĐÃ GIÀNH QUYỀN!';
            subText.textContent = `Phản xạ: +${b.buzzTime}s - Hãy trả lời!`;
        } else {
            const winnerName = state.players && state.players[b.winner] ? state.players[b.winner].name : b.winner.toUpperCase();
            screen.classList.add('winner-other');
            icon.textContent = '⏳';
            mainText.textContent = `${winnerName} ĐÃ BẤM TRƯỚC`;
            subText.textContent = 'Đang chờ kết quả...';
        }
    } else {
        screen.classList.add('locked');
        icon.textContent = '🔒';
        mainText.textContent = 'ĐÃ KHÓA CHUÔNG';
        subText.textContent = 'Lắng nghe MC đọc câu hỏi...';
    }
}
</script>

</body>
</html>
